[workspace]
members = [
  "crates/shackle",
  "crates/shackle-cli",
  "crates/shackle-diagnostics",
  "crates/shackle-fmt",
  "crates/shackle-hir",
  "crates/shackle-ls",
  "crates/shackle-syntax",
  "crates/shackle-thir",
  "crates/shackle-ty",
  "crates/shackle-utils",
  "crates/shackle-utils-derive",
  "crates/xcsp3-serde",
  "parsers/tree-sitter-datazinc",
  "parsers/tree-sitter-eprime",
  "parsers/tree-sitter-minizinc",
]
resolver = "2"

[workspace.package]
authors = [
  "Jip J. Dekker <jip@dekker.one>",
  "Jason Nguyen <admin@cyderize.org>",
]
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
derive_more = "2.1.1"
env_logger = "0.11.10"
expect-test = "1.5.1"
log = "0.4.29"
miette = "7.6.0"
rustc-hash = "2.1.2"
salsa = "0.27.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stacker = "0.1.24"
streaming-iterator = "0.1.9"
tree-sitter = "0.26.11"
tree-sitter-language = "0.1.7"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
# cargo_common_metadata = "warn"
clone_on_ref_ptr = "warn"
default_union_representation = "deny"
implicit_clone = "warn"
# Public docs are covered by rustc's `missing_docs`; private items are too noisy for `-D warnings`.
missing_docs_in_private_items = "allow"
mixed_read_write_in_expression = "deny"
negative_feature_names = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_chars_any = "warn"
# Integration tests are already test-only crates, so this lint is noisy with `--tests`.
tests_outside_test_module = "allow"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unseparated_literal_suffix = "warn"
wildcard_dependencies = "warn"
wrong_self_convention = "warn"
