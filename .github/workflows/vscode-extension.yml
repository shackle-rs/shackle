name: VS Code Extension

on:
  push:
    branches-ignore:
      - "dependabot/**"
    tags:
      - "code-extension-v*"
  pull_request:

env:
  RUST_CHANNEL: "stable"
  MINIZINC_REF: "develop"

jobs:
  vscode-extension:
    name: VS Code Extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64

    steps:
      - uses: actions/checkout@v7
      - name: Checkout MiniZinc repo
        uses: actions/checkout@v7
        with:
          repository: MiniZinc/libminizinc
          path: minizinc
          ref: ${{ env.MINIZINC_REF }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache-target: release
          channel: ${{ env.RUST_CHANNEL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: npm ci --workspace minizinc --include-workspace-root
      - name: Run linter
        run: npm run vscode:lint
        continue-on-error: true
      - name: Bundle VS Code extension with esbuild
        run: npm run vscode:build
      - name: Build shackle-ls
        run: cargo install --root editors/code --path crates/shackle-ls
      - name: Bundle VS Code extension assets
        shell: bash
        run: |
          mkdir -p "editors/code/share" "editors/code/vendor/minizinc/share"
          cp "LICENSE" "editors/code/LICENSE"
          cp -R "share/minizinc" "editors/code/share/minizinc"
          cp -R "minizinc/share/minizinc" "editors/code/vendor/minizinc/share/minizinc"
      - name: Package VS Code extension
        run: npm run package:vsix -w minizinc -- --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-${{ matrix.target }}
          path: |
            editors/code/*.vsix

  publish-extension:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs: vscode-extension
    if: startsWith(github.ref, 'refs/tags/code-extension-v')
    environment:
      name: vscode-extension
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches extension version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#code-extension-v}"
          package_version="$(node -p "require('./editors/code/package.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version '$tag_version' does not match editors/code/package.json version '$package_version'." >&2
            exit 1
          fi
      - name: Download VS Code extension artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: vscode-extension-*
          path: editors/code
          merge-multiple: true
      - name: Publish release on Open VSX
        run: |
          npx ovsx publish editors/code/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_ACCESS }}
      - name: Authenticate with Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish release on VS Code Marketplace
        run: |
          npx vsce publish --azure-credential --packagePath editors/code/*.vsix
